<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8fd6f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="おんぷアイランド">
<meta name="description" content="楽譜が読めるようになるアプリ。階名・リズム・けんばんハーモニカ・リコーダー・記号・聞きとり・共通教材の楽譜。">
<title>おんぷアイランド</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
/* おんぷアイランド  見た目 */
:root{
  --ink:#1f2d45; --ink2:#4a5a75; --paper:#fffdf7; --card:#ffffff;
  --sea1:#bfe9ff; --sea2:#e9f8ff; --sand:#fff4d6;
  --coral:#ff6f4f; --coral-d:#d9482a;
  --teal:#12b5a5; --teal-d:#0b8a7d;
  --sun:#ffc531; --sun-d:#e09a00;
  --grape:#7b5cff; --grape-d:#5636d8;
  --ok:#1fb86b; --ok-d:#11894d;
  --line:#dfe6f0;
  --r:22px;
  --shadow:0 6px 0 rgba(31,45,69,.10), 0 14px 30px rgba(31,45,69,.12);
  --fs:clamp(18px, 1.15vw + 13px, 25px);
  --fj:"Zen Maru Gothic","BIZ UDPGothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --fb:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --ic:#3bb3e0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea2)}
body{font-family:var(--fb);font-size:calc(var(--fs) * var(--fsk, 1));color:var(--ink);line-height:1.65;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
  font-feature-settings:"palt" 0;letter-spacing:.02em}
button{font-family:var(--fj);font-weight:700;color:inherit;cursor:pointer;border:0;background:none;font-size:inherit}
input{font-family:var(--fb);font-size:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(120% 80% at 50% 0%, #ffffff 0%, var(--sea2) 45%, var(--sea1) 100%)}
.scr{flex:1;display:flex;flex-direction:column;min-height:0;animation:scrIn .35s ease}
@keyframes scrIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px, env(safe-area-inset-top));flex:0 0 auto}
.bar .ttl{flex:1;font-family:var(--fj);font-weight:900;font-size:1.15em;line-height:1.25;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:8px 16px 28px;min-height:0}
.wrap{max-width:980px;margin:0 auto}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:58px;padding:.45em 1.2em;border-radius:999px;
  background:var(--coral);color:#fff;font-size:1.05em;letter-spacing:.06em;
  box-shadow:0 5px 0 var(--coral-d), 0 10px 18px rgba(217,72,42,.25);transition:transform .08s, box-shadow .08s, filter .2s;position:relative}
.btn:active,.btn.press{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-d), 0 4px 8px rgba(217,72,42,.2)}
.btn.teal{background:var(--teal);box-shadow:0 5px 0 var(--teal-d),0 10px 18px rgba(11,138,125,.25)}
.btn.teal:active{box-shadow:0 1px 0 var(--teal-d)}
.btn.grape{background:var(--grape);box-shadow:0 5px 0 var(--grape-d),0 10px 18px rgba(86,54,216,.25)}
.btn.grape:active{box-shadow:0 1px 0 var(--grape-d)}
.btn.sun{background:var(--sun);color:#3d2a00;box-shadow:0 5px 0 var(--sun-d),0 10px 18px rgba(224,154,0,.25)}
.btn.sun:active{box-shadow:0 1px 0 var(--sun-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #cfd8e6, 0 8px 14px rgba(31,45,69,.08)}
.btn.ghost:active{box-shadow:0 1px 0 #cfd8e6}
.btn.small{min-height:46px;font-size:.88em;padding:.3em 1em}
.btn.big{min-height:72px;font-size:1.25em;padding:.5em 1.8em}
.btn[disabled]{filter:grayscale(.7) opacity(.55);pointer-events:none}
.ibtn{width:52px;height:52px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  box-shadow:0 4px 0 #cfd8e6,0 8px 14px rgba(31,45,69,.08);transition:transform .08s}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 #cfd8e6}
.ibtn svg{width:28px;height:28px}

/* 光る（次に押すもの） */
.glow{animation:glowPulse 1.6s ease-in-out infinite}
.glow::after{content:"";position:absolute;inset:-7px;border-radius:inherit;border:4px solid var(--sun);opacity:0;animation:glowRing 1.6s ease-out infinite;pointer-events:none}
.glow::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);background-size:250% 100%;animation:shine 2.4s linear infinite}
@keyframes glowPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
@keyframes glowRing{0%{opacity:.95;transform:scale(.96)}100%{opacity:0;transform:scale(1.18)}}
@keyframes shine{0%{background-position:150% 0}100%{background-position:-100% 0}}

/* カード */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;position:relative}
.h1{font-family:var(--fj);font-weight:900;font-size:1.5em;line-height:1.35;margin:.2em 0 .3em}
.h2{font-family:var(--fj);font-weight:900;font-size:1.2em;line-height:1.4;margin:.2em 0 .2em}
.muted{color:var(--ink2)}
.center{text-align:center}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.c{justify-content:center}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:.3em;padding:.15em .8em;border-radius:999px;background:#fff;font-family:var(--fj);font-weight:700;font-size:.85em;box-shadow:0 2px 0 #d6deea}

/* スプラッシュ */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:radial-gradient(110% 80% at 50% 20%, #fff 0%, #dff4ff 40%, #8fd6f5 100%);transition:opacity .6s, transform .6s;padding:20px;text-align:center}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .logo{font-family:var(--fj);font-weight:900;font-size:clamp(40px, 8vw, 92px);line-height:1.1;letter-spacing:.04em;
  background:linear-gradient(180deg,#ff8a5c,#ff4f6d);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #fff) drop-shadow(0 8px 14px rgba(255,79,109,.35));animation:pop .8s cubic-bezier(.2,1.6,.4,1) both}
#splash .tag{font-family:var(--fj);font-weight:700;font-size:clamp(18px,2.6vw,30px);color:#1c4b6e;animation:fadeUp .8s .3s both}
#splash .art{width:min(640px,92vw);animation:fadeUp .9s .1s both}
#splash .hint{font-size:.85em;color:#2d6b8f;animation:fadeUp .8s .8s both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.float-note{animation:floatN 4s ease-in-out infinite}
@keyframes floatN{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}

/* 地図 */
.map{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;padding:6px 2px 10px}
.isl{position:relative;border-radius:28px;background:#fff;box-shadow:var(--shadow);padding:12px 12px 14px;text-align:center;transition:transform .12s;overflow:visible}
.isl:active{transform:scale(.97)}
.isl .pic{height:118px;display:flex;align-items:center;justify-content:center;border-radius:20px;margin-bottom:6px;
  background:linear-gradient(180deg, color-mix(in srgb,var(--ic) 18%, #fff), color-mix(in srgb,var(--ic) 34%, #fff))}
.isl .pic svg{height:104px;width:auto}
.isl .no{position:absolute;top:-10px;left:-6px;width:44px;height:44px;border-radius:50%;background:var(--ic);color:#fff;font-family:var(--fj);font-weight:900;
  display:flex;align-items:center;justify-content:center;font-size:1.1em;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.isl .nm{font-family:var(--fj);font-weight:900;font-size:1.08em;line-height:1.3}
.isl .sub{font-size:.78em;color:var(--ink2);line-height:1.4;min-height:2.8em}
.isl .prog{height:12px;border-radius:99px;background:#edf1f7;overflow:hidden;margin:8px 6px 2px}
.isl .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ic),color-mix(in srgb,var(--ic) 60%, #fff));border-radius:99px;transition:width .6s}
.isl.next{outline:5px solid var(--sun);outline-offset:3px;animation:islGlow 1.8s ease-in-out infinite}
.isl.next .badge{position:absolute;top:-16px;right:-6px;background:var(--sun);color:#3d2a00;font-family:var(--fj);font-weight:900;padding:.15em .8em;border-radius:99px;font-size:.8em;box-shadow:0 3px 0 var(--sun-d);animation:bob 1.6s ease-in-out infinite}
@keyframes islGlow{0%,100%{box-shadow:var(--shadow),0 0 0 0 rgba(255,197,49,.0)}50%{box-shadow:var(--shadow),0 0 0 12px rgba(255,197,49,.35)}}
.isl.clear .no{background:linear-gradient(135deg,#ffd75e,#f0a500)}

/* ステージ一覧 */
.stg{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border-radius:20px;padding:12px 16px;box-shadow:var(--shadow);margin-bottom:14px;position:relative;min-height:84px}
.stg .n{width:52px;height:52px;border-radius:16px;background:var(--ic);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--fj);font-weight:900;font-size:1.15em;flex:0 0 auto}
.stg .t{flex:1;min-width:0}
.stg .t b{display:block;font-family:var(--fj);font-size:1.05em;line-height:1.35}
.stg .t small{color:var(--ink2);font-size:.8em;line-height:1.4;display:block}
.stars{display:inline-flex;gap:2px;flex:0 0 auto}
.stars svg{width:30px;height:30px}
.stg.next{outline:5px solid var(--sun);outline-offset:2px;animation:islGlow 1.8s ease-in-out infinite}

/* 問題 */
.qhead{display:flex;align-items:center;gap:10px;padding:4px 0 8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.dots i{width:16px;height:16px;border-radius:50%;background:#dfe6f0;transition:background .3s, transform .3s}
.dots i.now{background:var(--sun);transform:scale(1.35)}
.dots i.ok{background:var(--ok)}
.dots i.mid{background:#7cc8f0}
.prompt{font-family:var(--fj);font-weight:900;font-size:1.35em;line-height:1.45;text-align:center;margin:.1em 0 .4em}
.stage{background:#fff;border-radius:26px;box-shadow:var(--shadow);padding:10px 12px;margin:0 auto 14px;max-width:760px;position:relative}
.vf{width:100%}
.vf > div{width:100%;display:flex;justify-content:center}
.stage .vf{width:100%;display:flex;justify-content:center}
.stage .vf svg{max-width:100%;height:auto}
.choices{display:grid;gap:14px;max-width:820px;margin:8px auto 0;grid-template-columns:repeat(auto-fit,minmax(min(140px,40vw),1fr))}
.choices.wide{grid-template-columns:repeat(auto-fit,minmax(min(230px,80vw),1fr))}
.ch{position:relative;min-height:84px;border-radius:22px;background:#fff;font-size:1.45em;font-family:var(--fj);font-weight:900;padding:.3em .4em;
  box-shadow:0 6px 0 #cfd8e6, 0 10px 18px rgba(31,45,69,.08);transition:transform .08s, box-shadow .08s, background .2s;line-height:1.25}
.ch:active{transform:translateY(5px);box-shadow:0 1px 0 #cfd8e6}
.ch.svg{padding:8px;font-size:1em}
.ch.svg svg{width:100%;height:auto;max-height:180px}
.ch.right{background:var(--ok);color:#fff;box-shadow:0 6px 0 var(--ok-d);animation:yay .5s}
.ch.miss{animation:shake .45s;background:#fff1ec}
.ch.miss::after{content:"";position:absolute;inset:0;border-radius:inherit;border:3px dashed #ffb39f;pointer-events:none}
.ch.dim{opacity:.35}
.ch.hintme{animation:glowPulse 1.2s infinite;outline:4px solid var(--sun);outline-offset:3px}
@keyframes yay{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.hintbox{max-width:760px;margin:12px auto 0;background:#fff8e1;border:3px solid #ffe08a;border-radius:20px;padding:10px 16px;display:flex;gap:12px;align-items:center;animation:fadeUp .3s}
.hintbox svg{width:54px;height:54px;flex:0 0 auto}
.foot{display:flex;justify-content:center;gap:14px;padding:14px 0 6px;flex-wrap:wrap}
.vf-hl path,.vf-hl rect,.vf-hl use{fill:var(--coral)!important;stroke:var(--coral)!important}
.vf-ok path{fill:var(--ok)!important;stroke:var(--ok)!important}
.vf-dim{opacity:.3}
.namebar{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;min-height:1.8em;font-family:var(--fj);font-weight:900;font-size:1.25em}
.namebar span{min-width:2.2em;text-align:center;border-bottom:4px solid #e3e9f2;padding:0 .2em}
.namebar span.f{border-color:var(--ok);color:var(--ok-d)}
.namebar span.cur{border-color:var(--sun)}

/* 五線タップ */
.tapzone{position:absolute;left:0;right:0;cursor:pointer;border-radius:8px}
.tapzone:hover{background:rgba(255,197,49,.18)}
.tapzone.on{background:rgba(31,184,107,.22)}
.tapzone.no{background:rgba(255,111,79,.18)}

/* 鍵盤 */
.kb{position:relative;margin:6px auto 0;max-width:900px;height:clamp(150px,26vh,240px);user-select:none;touch-action:none}
.kb .w{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#fff 0%,#fff 82%,#eef2f8 100%);border:2px solid #9aa8bd;border-radius:0 0 12px 12px;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-family:var(--fj);font-weight:900;font-size:clamp(13px,1.7vw,20px);color:#5a6a85;transition:background .1s}
.kb .b{position:absolute;top:0;height:60%;background:linear-gradient(180deg,#3a4458,#1b2233);border-radius:0 0 8px 8px;z-index:2;box-shadow:0 3px 0 #0c1019;transition:background .1s}
.kb .w.down{background:linear-gradient(180deg,#ffe9a8,#ffd25c)}
.kb .b.down{background:linear-gradient(180deg,#ffcf4a,#e0a000)}
.kb .w.okk{background:linear-gradient(180deg,#b9f3d2,#5fd99a)}
.kb .w.hintk,.kb .b.hintk{animation:keyHint 1s ease-in-out infinite}
@keyframes keyHint{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,197,49,0)}50%{box-shadow:inset 0 0 0 8px rgba(255,197,49,.9)}}

.kb-stick{position:sticky;bottom:0;z-index:4;background:#fff;padding-top:8px;border-radius:0 0 14px 14px}
/* リコーダー */
.rec svg{width:100%;height:auto}
.hole{fill:#fff;stroke:#5b4632;stroke-width:3}
.hole.c{fill:#3a2a1c}
.hole.h{fill:url(#halfFill)}

/* リズム */
.drum{width:min(260px,56vw,34vh);aspect-ratio:1;border-radius:50%;margin:10px auto 0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 40% 35%,#fff7e0,#ffd36b 55%,#f2a900);box-shadow:0 10px 0 #c98a00,0 18px 30px rgba(201,138,0,.35);
  font-family:var(--fj);font-weight:900;font-size:1.5em;color:#5a3b00;transition:transform .05s;touch-action:none;position:relative}
.drum.hit{transform:translateY(7px) scale(.98);box-shadow:0 3px 0 #c98a00}
.drum.off{filter:grayscale(.6) opacity(.6)}
.count{font-family:var(--fj);font-weight:900;font-size:3em;text-align:center;height:1.3em;line-height:1.3;color:var(--coral)}
.beatcursor{position:absolute;top:6px;bottom:6px;width:6px;border-radius:3px;background:rgba(255,197,49,.85);display:none}

/* ダイアログ・ローディング */
.ov{position:fixed;inset:0;z-index:60;background:rgba(18,32,56,.45);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dlg{background:#fff;border-radius:28px;max-width:560px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .35s cubic-bezier(.2,1.4,.4,1);max-height:92dvh;overflow:auto}
.dlg .h1{margin-top:0}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff;font-family:var(--fj);font-weight:900;font-size:1.2em}
.loading .ln{display:flex;gap:10px}
.loading .ln i{width:20px;height:20px;border-radius:50%;background:#fff;animation:jump 1s infinite}
.loading .ln i:nth-child(2){animation-delay:.15s}.loading .ln i:nth-child(3){animation-delay:.3s}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}

/* キーパッド (★15) */
.kp-dots{display:flex;justify-content:center;gap:14px;margin:12px 0 18px;min-height:26px}
.kp-dots i{width:22px;height:22px;border-radius:50%;border:3px solid #9aa8bd;transition:background .15s}
.kp-dots i.f{background:var(--grape);border-color:var(--grape)}
.kp-dots.ng{animation:shake .45s}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:320px;margin:0 auto}
.kp button{aspect-ratio:1;border-radius:50%;background:#f1f4fa;font-size:1.6em;box-shadow:0 4px 0 #cfd8e6}
.kp button:active{transform:translateY(3px);box-shadow:0 1px 0 #cfd8e6}
.kp .ok{background:var(--grape);color:#fff;box-shadow:0 4px 0 var(--grape-d);font-size:1em}
.kp .del{font-size:.9em}

/* 紙ふぶき */
.cf{position:fixed;width:12px;height:16px;z-index:70;pointer-events:none;border-radius:3px}
.burst{position:fixed;z-index:70;pointer-events:none;font-family:var(--fj);font-weight:900;font-size:clamp(40px,8vw,84px);color:var(--ok);
  text-shadow:0 4px 0 #fff, 0 8px 20px rgba(31,184,107,.4);animation:burst .9s ease-out forwards;left:50%;top:38%;transform:translate(-50%,-50%)}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}

/* 先生 */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.tile{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:130px}
.tile b{font-family:var(--fj);font-size:1.1em}
.tile small{color:var(--ink2);font-size:.8em;line-height:1.5}
.tile .tic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff}
.seg{display:inline-flex;background:#eef2f8;border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{padding:.35em 1em;border-radius:999px;font-size:.9em;min-height:44px}
.seg button.on{background:#fff;box-shadow:0 2px 0 #cfd8e6;color:var(--grape-d)}
.big-screen{background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:min(44vh,460px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}
.chips .btn{flex:0 0 auto;white-space:nowrap}
.flash-name{font-family:var(--fj);font-weight:900;font-size:clamp(60px,12vw,160px);color:var(--coral);line-height:1.1;min-height:1.2em}
.xshare{display:block;margin:26px auto 4px;color:#8a97ab;font-size:.8em;padding:.4em 1em;border-radius:999px;background:#f1f4fa}
.xcard{position:fixed;right:14px;bottom:14px;z-index:65;max-width:min(340px,calc(100vw - 28px));background:#fff;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:14px 16px;animation:fadeUp .3s;font-size:.85em}
.xcard .row{gap:8px;margin-top:8px}
.tbl{width:100%;border-collapse:collapse;font-size:.85em}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}

/* 結果 */
.result-stars{display:flex;justify-content:center;gap:10px;margin:10px 0}
.result-stars svg{width:min(90px,22vw);height:auto;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.result-stars svg:nth-child(2){animation-delay:.25s}.result-stars svg:nth-child(3){animation-delay:.5s}

.learn-visual{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;margin:8px 0}
.say{display:flex;gap:12px;align-items:flex-start;max-width:760px;margin:0 auto}
.say .guide{width:76px;flex:0 0 auto}
.say .bubble{flex:1;background:#fff;border-radius:22px;padding:14px 18px;box-shadow:var(--shadow);position:relative;font-size:1.05em;line-height:1.75}
.say .bubble::before{content:"";position:absolute;left:-12px;top:22px;border:12px solid transparent;border-right-color:#fff;border-left:0}
.em{color:var(--coral-d);font-weight:700}
.sym{font-family:"Times New Roman",serif;font-style:italic;font-weight:700}
.micstat{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--fj);font-weight:700;min-height:2em}
.meter{width:min(320px,70vw);height:16px;border-radius:99px;background:#edf1f7;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7cc8f0,var(--teal));transition:width .08s}
@media (max-width:520px){
  .bar{padding:8px 12px}
  .body{padding:6px 12px 24px}
  .ch{min-height:72px;font-size:1.3em}
  .say .guide{width:56px}
  .map{grid-template-columns:repeat(2,1fr);gap:14px}
  .isl .pic{height:90px}.isl .pic svg{height:80px}
  .isl .sub{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

/* ===== ホーム（3D地図・ランク・ドック） ===== */
.status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border-radius:999px;padding:8px 10px 8px 20px;box-shadow:var(--shadow);margin:2px 0 14px}
.status .rk{display:flex;flex-direction:column;line-height:1.2}
.status .rk small{font-size:.85em;color:var(--ink2)}
.status .rk b{font-family:var(--fj);font-weight:900}
.status .xpbar{flex:1;min-width:120px}
.xpbar{height:16px;border-radius:99px;background:#edf1f7;overflow:hidden;margin:8px 0 4px;box-shadow:inset 0 2px 3px rgba(0,0,0,.06)}
.xpbar.slim{height:12px;margin:0}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7b5cff,#ff6fae,#ffc531);transition:width .25s}
.world{position:relative;height:clamp(340px,60vh,720px);border-radius:30px;overflow:hidden;box-shadow:var(--shadow), inset 0 0 0 4px #fff;background:#9fdcf7}
.world .hud{position:absolute;left:12px;top:12px;right:12px;z-index:2;pointer-events:none}
.world .hud .say{max-width:620px;margin:0}
.world .hud .bubble{font-size:.95em;background:rgba(255,255,255,.94);backdrop-filter:blur(6px)}
.world .hint3d{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:2;background:rgba(31,45,69,.72);color:#fff;font-family:var(--fj);font-weight:700;font-size:.8em;padding:.35em 1.1em;border-radius:99px;pointer-events:none;white-space:nowrap;animation:hintFade 6s 1s both}
@keyframes hintFade{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.dock{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:16px 0 4px}
.dock .btn svg{width:26px;height:26px}
.combo{font-family:var(--fj);font-weight:900;color:#fff;background:linear-gradient(135deg,#ff8a5c,#ff4f6d);border-radius:999px;padding:.1em .9em;font-size:.95em;opacity:0;transform:scale(.6);transition:opacity .2s, transform .2s;white-space:nowrap}
.combo.on{opacity:1;transform:scale(1)}
.combo.fire{background:linear-gradient(135deg,#ffc531,#ff4f6d,#7b5cff);box-shadow:0 0 18px rgba(255,79,109,.55)}
.combo.pop{animation:yay .45s}
.xpbox{background:#f7f9fd;border-radius:18px;padding:10px 16px;margin:14px auto 0;max-width:460px;text-align:left}
.xpgain{font-family:var(--fj);font-weight:900;color:var(--grape-d)}
.xpgain b{font-size:1.4em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:520px;margin:0 auto}
.cal .cd{background:#f1f4fa;border-radius:12px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.85em;color:var(--ink2);font-weight:700}
.cal .cd svg{width:60%;height:auto}
.cal .cd i{width:40%;aspect-ratio:1;border-radius:50%;background:#e1e7f0}
.cal .cd.on{background:#fff6d6}
.cal .cd.td{outline:3px solid var(--sun)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-top:16px}
.fcard{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;transition:transform .12s}
.fcard:active{transform:scale(.96)}
.fcard .fart{width:110px;height:110px}
.fcard .fart svg{width:100%;height:100%}
.fcard b{font-family:var(--fj);font-size:1em}
.fcard small{font-size:.85em;color:var(--ink2);line-height:1.4}
.fcard.locked{background:#f4f6fa}
.fcard:not(.locked) .fart{animation:bob 3s ease-in-out infinite}
@media (max-width:520px){ .world{height:min(62vh,460px);border-radius:22px} .fgrid{grid-template-columns:repeat(2,1fr)} .status{border-radius:22px} }

<script>
'use strict';
/* ===== おんぷアイランド  土台 ===== */
const APP_NAME = 'おんぷアイランド';
const APP_URL = 'https:' + '/' + '/kawaitomohiro.github.io/onpu-island/';

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) {
    if (c == null || c === false) continue;
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const $ = (s, r) => (r || document).querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function svgEl(str) { const d = document.createElement('div'); d.innerHTML = str.trim(); return d.firstChild; }

/* ---- 連打よけ：押してから一定時間は同じボタンを受けつけない ---- */
function tap(fn, wait) {
  let busy = false;
  return function (ev) {
    if (busy) return;
    busy = true;
    setTimeout(() => { busy = false; }, wait || 450);
    try { const r = fn.call(this, ev); if (r && r.catch) r.catch(err => console.error(err)); } catch (e) { console.error(e); }
  };
}

/* ===== 記録（端末に保存） ===== */
const Store = {
  KEY: 'onpuIsland.v1',
  data: null,
  ok: true,
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) { this.ok = false; }
    if (!d || typeof d !== 'object') d = {};
    d.profiles = d.profiles || {};
    d.settings = Object.assign({ recorder: 'german', autoFs: true, sound: true, mic: true, map3d: true, textScale: 1 }, d.settings || {});
    if (!d.profiles.test) d.profiles.test = { id: 'test', name: 'テストプレイヤー', stars: {}, created: Date.now() };
    d.current = d.current && d.profiles[d.current] ? d.current : null;
    this.data = d;
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
    return d;
  },
  save() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); this.ok = true; }
    catch (e) { this.ok = false; }
  },
  get me() { return this.data.profiles[this.data.current] || null; },
  get set() { return this.data.settings; },
  addProfile(name) {
    const id = 'p' + Date.now().toString(36) + rnd(1000);
    this.data.profiles[id] = { id, name, stars: {}, created: Date.now() };
    this.data.current = id; this.save(); return id;
  },
  starsOf(stageId) { const m = this.me; return m ? (m.stars[stageId] || 0) : 0; },
  setStars(stageId, n) {
    const m = this.me; if (!m) return;
    if ((m.stars[stageId] || 0) < n) m.stars[stageId] = n;
    m.last = Date.now(); this.save();
  }
};

/* ===== 画面の切りかえ ===== */
let curScreen = null;
function go(builder) {
  Audio2.stopAll();
  Mic.stop();
  if (typeof World3D !== 'undefined') World3D.dispose(); // 3Dの地図を かたづける
  document.querySelectorAll('.xcard').forEach(e => e.remove()); // Xの案内は先生の画面の中だけ（★11）
  const app = $('#app');
  const scr = h('div', { class: 'scr' });
  app.innerHTML = '';
  app.appendChild(scr);
  curScreen = scr;
  builder(scr);
  const b = scr.querySelector('.body'); if (b) b.scrollTop = 0; // 別の画面へ移るときだけ上へ
}
function topBar(title, opts) {
  opts = opts || {};
  const bar = h('div', { class: 'bar' });
  if (opts.back) bar.appendChild(h('button', { class: 'ibtn', 'aria-label': 'もどる', onclick: tap(opts.back) }, svgEl(ICON.back)));
  bar.appendChild(h('div', { class: 'ttl' }, title));
  if (opts.right) bar.appendChild(opts.right);
  bar.appendChild(h('button', { class: 'ibtn', 'aria-label': 'ぜんがめん', title: 'ぜんがめん', onclick: tap(() => FS.toggle()) }, svgEl(ICON.fs)));
  return bar;
}

/* ===== ダイアログ（alert/confirm のかわり ★5） ===== */
function dialog(o) {
  return new Promise(res => {
    const ov = h('div', { class: 'ov' });
    const close = v => { ov.remove(); document.removeEventListener('keydown', onKey); res(v); };
    const onKey = e => { if (e.key === 'Escape') close(null); };
    const btns = (o.buttons || [{ label: 'OK', value: true, cls: '' }]).map(b =>
      h('button', { class: 'btn ' + (b.cls || ''), onclick: tap(() => close(b.value)) }, b.label));
    const box = h('div', { class: 'dlg' },
      o.art ? h('div', { class: 'center' }, svgEl(o.art)) : null,
      o.title ? h('div', { class: 'h1 center' }, o.title) : null,
      o.text ? h('div', { class: 'center', style: { margin: '6px 0 16px', whiteSpace: 'pre-line' } }, o.text) : null,
      o.body || null,
      h('div', { class: 'row c', style: { marginTop: '14px' } }, btns));
    ov.appendChild(box);
    if (o.outside !== false) ov.addEventListener('click', e => { if (e.target === ov) close(null); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov);
  });
}
function toast(text, ms) {
  const t = h('div', { class: 'pill', style: { position: 'fixed', left: '50%', bottom: '24px', transform: 'translateX(-50%)', zIndex: 80, fontSize: '1em', padding: '.5em 1.2em', boxShadow: '0 8px 24px rgba(0,0,0,.18)' } }, text);
  document.body.appendChild(t); setTimeout(() => t.remove(), ms || 2200);
}
/* ローディング（★6） */
let loadingEl = null;
function loading(on, text) {
  if (on) {
    if (loadingEl) { loadingEl.querySelector('.lt').textContent = text || 'じゅんび中…'; return; }
    loadingEl = h('div', { class: 'ov', style: { zIndex: 90 } },
      h('div', { class: 'loading' }, h('div', { class: 'ln' }, h('i'), h('i'), h('i')), h('div', { class: 'lt' }, text || 'じゅんび中…')));
    document.body.appendChild(loadingEl);
  } else if (loadingEl) { loadingEl.remove(); loadingEl = null; }
}

/* ===== 数字キーパッド（★15） ===== */
function keypadDialog(o) {
  // o: {title, text, min, max, check(async code)->bool}
  return new Promise(res => {
    let code = '';
    const min = o.min || 4, max = o.max || 8;
    const dots = h('div', { class: 'kp-dots' });
    const ov = h('div', { class: 'ov' });
    const draw = () => {
      dots.innerHTML = '';
      const n = Math.max(min, code.length);
      for (let i = 0; i < n; i++) dots.appendChild(h('i', { class: i < code.length ? 'f' : '' }));
      okBtn.disabled = code.length < min;
      okBtn.style.opacity = code.length < min ? .4 : 1;
    };
    const close = v => { ov.remove(); document.removeEventListener('keydown', onKey); res(v); };
    let checking = false;
    const submit = async () => {
      if (code.length < min || checking) return;
      checking = true;
      const ok = await o.check(code);
      checking = false;
      if (ok) close(code);
      else { dots.classList.remove('ng'); void dots.offsetWidth; dots.classList.add('ng'); code = ''; draw(); }
    };
    const add = d => { if (code.length < max) { code += d; draw(); } };
    const del = () => { code = code.slice(0, -1); draw(); };
    const onKey = e => {
      if (/^[0-9]$/.test(e.key)) add(e.key);
      else if (e.key === 'Backspace') del();
      else if (e.key === 'Enter') submit();
      else if (e.key === 'Escape') close(null);
    };
    const kp = h('div', { class: 'kp' });
    ['1', '2', '3', '4', '5', '6', '7', '8', '9'].forEach(d => kp.appendChild(h('button', { onclick: () => add(d) }, d)));
    kp.appendChild(h('button', { class: 'del', onclick: () => close(null) }, 'やめる'));
    kp.appendChild(h('button', { onclick: () => add('0') }, '0'));
    kp.appendChild(h('button', { class: 'del', 'aria-label': '1つけす', onclick: del }, '⌫'));
    const okBtn = h('button', { class: 'btn grape', style: { width: '100%', marginTop: '16px' }, onclick: submit }, '決定');
    ov.appendChild(h('div', { class: 'dlg', style: { maxWidth: '400px' } },
      h('div', { class: 'h2 center' }, o.title || 'パスワード'),
      o.text ? h('div', { class: 'center muted', style: { fontSize: '.85em' } }, o.text) : null,
      dots, kp, okBtn));
    ov.addEventListener('click', e => { if (e.target === ov) close(null); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov);
    draw();
  });
}

/* ===== 全画面 ===== */
const FS = {
  asked: false,
  el() { return document.fullscreenElement || document.webkitFullscreenElement; },
  can() { const d = document.documentElement; return !!(d.requestFullscreen || d.webkitRequestFullscreen); },
  enter() {
    const d = document.documentElement;
    try {
      const p = d.requestFullscreen ? d.requestFullscreen({ navigationUI: 'hide' }) : (d.webkitRequestFullscreen && d.webkitRequestFullscreen());
      if (p && p.catch) p.catch(() => { });
    } catch (e) { }
  },
  exit() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) { } },
  toggle() {
    if (this.el()) this.exit();
    else if (this.can()) this.enter();
    else toast('この端末は「ホーム画面に追加」すると全画面で使えます', 3500);
  },
  // 開いて最初にどこかを押したら、全画面にする（ブラウザは押す前には全画面にできない）
  arm() {
    const first = () => {
      document.removeEventListener('pointerdown', first, true);
      document.removeEventListener('keydown', first, true);
      if (this.asked) return; this.asked = true;
      if (Store.set.autoFs && !this.el() && this.can() && !window.__noSplash) this.enter();
    };
    document.addEventListener('pointerdown', first, true);
    document.addEventListener('keydown', first, true);
  }
};

/* ===== 先生のパスワードの照合 =====
   数字そのものは どこにも書かない（★2）。PBKDF2 を30万回かけた結果だけを持つので、
   ページのソースから総当たりで 数字を当てるのは 現実的でない */
async function teacherKey(code) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode('onpu-island-v1'), iterations: 300000 }, key, 256);
  return [...new Uint8Array(bits)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const TEACHER_HASH = '16c4366842a99cfc13f6313538b47399a199e571c6e38c9e5ce38b9da49090f6';

/* ===== 正解の演出 ===== */
function confetti(n) {
  const colors = ['#ff6f4f', '#ffc531', '#12b5a5', '#7b5cff', '#3bb3e0', '#ff4f9a'];
  for (let i = 0; i < (n || 26); i++) {
    const c = h('div', { class: 'cf' });
    c.style.background = pick(colors);
    c.style.left = (40 + Math.random() * 20) + 'vw';
    c.style.top = '40vh';
    document.body.appendChild(c);
    const dx = (Math.random() - .5) * 90, dy = -30 - Math.random() * 40, rot = Math.random() * 720;
    c.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 },
    { transform: `translate(${dx * .6}vw,${dy}vh) rotate(${rot / 2}deg)`, opacity: 1, offset: .45 },
    { transform: `translate(${dx}vw,${dy + 70}vh) rotate(${rot}deg)`, opacity: 0 }],
      { duration: 1300 + Math.random() * 600, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => c.remove();
  }
}
function burst(text, color) {
  const b = h('div', { class: 'burst' }, text);
  if (color) b.style.color = color;
  document.body.appendChild(b); setTimeout(() => b.remove(), 950);
}

/* ===== アイコンと絵 ===== */
const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="#1f2d45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  fs: '<svg viewBox="0 0 24 24" fill="none" stroke="#1f2d45" stroke-width="2.6" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  ear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
  person: '<svg viewBox="0 0 24 24" fill="#1f2d45"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="#1f2d45" stroke-width="2.4"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'
};
function starSvg(on) {
  return on
    ? '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z" fill="#ffc531" stroke="#e09a00" stroke-width="1.4" stroke-linejoin="round"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z" fill="#eef1f6" stroke="#cfd8e6" stroke-width="1.4" stroke-linejoin="round"/></svg>';
}
function starsEl(n) { const s = h('span', { class: 'stars' }); for (let i = 0; i < 3; i++) s.appendChild(svgEl(starSvg(i < n))); return s; }

/* 案内役「ピッチ」：まるい4分音符の子 */
function guideSvg(mood) {
  const mouth = mood === 'wow' ? '<ellipse cx="50" cy="80" rx="7" ry="8" fill="#7a2b1a"/>'
    : mood === 'think' ? '<path d="M43 80 q7 -4 14 0" stroke="#7a2b1a" stroke-width="4" fill="none" stroke-linecap="round"/>'

    choices: shuffle(opts.map((o, i) => ({ staff: { notes: o, clef: false, time: null, scale: 1.2, end: false }, ok: i === 0 }))), wide: true,

    if (Math.random() < .5) { const j = (i + 2) % 4; let nj = pick(pool); while (nj === b[j].s) nj = pick(pool); b[j] = N(nj); }
    if (!opts.some(x => sameNotes(x, b))) opts.push(b);
  }
  return {
    type: 'choice', prompt: '聞こえた旋律は どれ？', play: () => Audio2.playSeq(good, { tempo: 84 }), autoPlay: true,
    choices: shuffle(opts.map((o, i) => ({ staff: { notes: o, scale: 1.2 }, ok: i === 0 }))), wide: true, hint: '音が 上がったか 下がったかに 気をつけて 聞こう。'

}
function randomMelody(pool, len) {

    cur = pick(near.length ? near : pool); out.push(N(cur));

}

}

/* ===== うたの図書館（学習指導要領の 歌唱共通教材） =====
   曲のデータは 04a_kyotsu_songs.js の KYOTSU（旋律だけ・歌詞なし）。
   1年「うみ」は 作曲者（井上武士 1974年没）の保護期間中なので のせない。
   ほかは 文部省唱歌（1910〜1913年ごろ）・日本古謡・1967年までに亡くなった作曲者の曲。 */

const KY_GRADE_NAME = g => `${g}年`;
const KY_MISSING = { 1: '「うみ」は 作曲した人の 著作権が まだ のこっているので 入っていないよ。', 2: '「かくれんぼ」は じゅんび中。', 6: '「越天楽今様」は じゅんび中。' };
const kyCap = song => { const [a, b] = song.time.split('/').map(Number); return a * 4 / b; };
const kySongs = g => KYOTSU.filter(s => s.grade === g);
const kyTempo = song => song.tempo || (song.time === '6/8' ? 100 : song.time === '3/4' ? 100 : 92);
const kyPer = song => song.time === '6/8' ? 6 : Number(song.time.split('/')[0]);
function kyPhrase(song, k) { const [a, b] = song.phrases[k]; return song.notes.slice(a, b + 1); }
/* 添字 idx の音が 小節の中の どこから始まるかを見て、その音から始めたときの「弱起の拍数」を返す */
function kyPickupAt(song, idx) {
  const cap = kyCap(song); let bb = 0;
  for (let i = 0; i < idx; i++) bb += BEATS[song.notes[i].d];
  const p = song.pickup || 0;
  const pos = p ? (bb < p - 1e-6 ? cap - p + bb : (bb - p) % cap) : bb % cap;
  if (pos < 1e-6 || Math.abs(pos - cap) < 1e-6) return 0;
  return cap - pos;
}
function kyStaff(song, notes, pickup, extra) {
  return Object.assign({ notes, time: song.time, pickup: pickup || 0, compound: song.time === '6/8', tempo: kyTempo(song) }, extra || {});
}
const kyHasAcc = ns => ns.some(n => n.acc);
const kyPitchKey = ns => ns.filter(n => n.s != null).map(n => n.s + (n.acc || '')).join(',');
function kyPhraseList(song, filter) {
  return song.phrases.map((_, k) => k).filter(k => { const ns = kyPhrase(song, k); return ns.some(n => n.s != null) && (!filter || filter(ns, k)); });
}

/* 1. この楽譜は どの曲？（楽譜を読んで 曲を当てる。聞いて たしかめても よい） */
function kyTitleQ(g) {
  const list = kySongs(g);
  const song = pick(list);
  const notes = kyPhrase(song, 0);
  const others = shuffle(list.filter(x => x !== song)).slice(0, 2);
  return {
    type: 'choice', prompt: 'この楽譜は どの曲の はじまり？',
    staff: kyStaff(song, notes, song.pickup, { scale: 1.6, fit: true, end: false }),
    play: () => Audio2.playSeq(notes, { tempo: kyTempo(song) }),
    choices: shuffle([song].concat(others)).map(x => ({ label: x.title, ok: x === song })), wide: true,
    hint: 'まず 階名で 読んで、心の中で 歌ってみよう。スピーカーで 聞いて たしかめても いいよ。'
  };
}
/* 2. フレーズの 階名を じゅんばんに 読む */
function kyReadQ(song) {
  const ks = kyPhraseList(song, ns => !kyHasAcc(ns) && ns.filter(n => n.s != null).length <= 16);
  const k = pick(ks.length ? ks : [0]);
  const notes = kyPhrase(song, k);
  const ss = notes.filter(n => n.s != null).map(n => n.s);
  let lo = Math.min(...ss), hi = Math.max(...ss);
  while (hi - lo < 4) { if (lo > -3) lo--; if (hi - lo < 4 && hi < 12) hi++; }
  return {
    type: 'seqNames', prompt: `「${song.title}」の 階名を じゅんばんに えらぼう`, notes, pool: rangeArr(lo, hi),
    time: song.time, pickup: kyPickupAt(song, song.phrases[k][0]),
    hint: '1つずつ、線の上か間かを たしかめよう。同じ高さの音は 同じ名前だよ。'
  };
}
/* 3. 聞こえた フレーズは どれ？ */
function kyEarQ(song) {
  const ks = kyPhraseList(song);
  const k = pick(ks);
  const notes = kyPhrase(song, k);
  const seen = new Set([kyPitchKey(notes)]);
  const opts = [{ k, ok: true }];
  shuffle(ks.filter(x => x !== k)).forEach(x => { const key = kyPitchKey(kyPhrase(song, x)); if (opts.length < 3 && !seen.has(key)) { seen.add(key); opts.push({ k: x }); } });
  // 段が少ない曲は、同じ学年・同じ拍子の ほかの曲の段を まぜて 3つにする
  if (opts.length < 3) shuffle(KYOTSU.filter(x => x !== song && x.grade === song.grade && x.time === song.time).concat(KYOTSU.filter(x => x !== song && x.time === song.time))).forEach(x => {
    kyPhraseList(x).forEach(k2 => { const key = kyPitchKey(kyPhrase(x, k2)); if (opts.length < 3 && !seen.has(key)) { seen.add(key); opts.push({ song: x, k: k2 }); } });
  });
  if (opts.length < 2) return kyReadQ(song);
  return {
    type: 'choice', prompt: `「${song.title}」の 聞こえた所は どれ？`, oneCol: true,
    play: () => Audio2.playSeq(notes, { tempo: kyTempo(song) }), autoPlay: true,
    choices: shuffle(opts).map(o => { const sg = o.song || song; return { staff: kyStaff(sg, kyPhrase(sg, o.k), kyPickupAt(sg, sg.phrases[o.k][0]), { scale: 1.0, end: false, fit: true, fitW: Math.min(700, window.innerWidth - 70), minScale: 1.0, narrowNoteW: 34 }), ok: !!o.ok }; }), wide: true,
    hint: 'はじまりの音の 高さと、上がるか 下がるかを 楽譜で くらべよう。'
  };
}
/* 4. けんばんで ひく */
const kyShort = ns => ns.filter(n => n.s != null).length <= 18;
function kyKeyQ(song) {
  const ks0 = kyPhraseList(song, kyShort), ks = ks0.length ? ks0 : kyPhraseList(song);
  const k = pick(ks);
  const notes = kyPhrase(song, k);
  const ss = notes.filter(n => n.s != null).map(n => n.s);
  return {
    type: 'keySeq', prompt: `「${song.title}」を けんばんで ひこう`, notes, time: song.time, pickup: kyPickupAt(song, song.phrases[k][0]),

/* 5. 階名で 歌う */
function kySingQ(song) {

  const k = pick(ks0.length ? ks0 : kyPhraseList(song));
  const notes = kyPhrase(song, k);
  return { type: 'blowSeq', prompt: `「${song.title}」を 階名で 歌おう`, notes, kind: 'sing', time: song.time, pickup: kyPickupAt(song, song.phrases[k][0]), tempo: kyTempo(song), hint: '光っている音符を 階名で 歌おう。' };
}
/* 6. 拍子は いくつ？（楽譜を見て 拍子を 読む） */
function kyTimeQ(g) {
  const sure = kySongs(g).filter(s => !/拍子/.test(s.memo || ''));
  const song = pick(sure.length ? sure : kySongs(g));
  const notes = kyPhrase(song, 0);
  const all = ['2/4', '3/4', '4/4', '6/8'];
  const name = t => t === '6/8' ? '8分の6拍子' : `4分の${t[0]}拍子`;
  const opts = shuffle([song.time].concat(shuffle(all.filter(t => t !== song.time)).slice(0, 2)));
  return {
    type: 'choice', prompt: `「${song.title}」は 何拍子？`,
    staff: kyStaff(song, notes, song.pickup, { scale: 1.5, fit: true, hideTime: true, end: false }),
    play: () => Audio2.playSeq(notes, { tempo: kyTempo(song), metro: true, beatsPerBar: kyPer(song), unit: song.time === '6/8' ? .5 : 1 }),
    choices: opts.map(t => ({ label: name(t), ok: t === song.time })), wide: true,
    hint: '小節線から 小節線までの 拍を たしてみよう。4分音符＝1拍、2分音符＝2拍、8分音符＝半拍。'
  };
}

function kyStage(g) {
  const list = kySongs(g);
  return {
    id: '9-' + g, title: `${KY_GRADE_NAME(g)}の 共通教材`, sub: list.map(s => s.title).join('・'), n: Math.max(8, list.length * 3),
    learn: list.map((song, i) => ({
      text: `${i === 0 ? `${KY_GRADE_NAME(g)}で みんなが 歌う曲（共通教材）の 楽譜だよ。${KY_MISSING[g] ? `<br><small>${KY_MISSING[g]}</small>` : ''}<br>` : ''}<b>「${song.title}」</b>　${song.origin}・${song.time === '6/8' ? '8分の6拍子' : `4分の${song.time[0]}拍子`}。おてほんに 合わせて、階名を 読んでみよう。`,
      staff: kyStaff(song, song.notes, song.pickup, { names: true, scale: 1.5, fit: true, minScale: 1.0, noteW: 60, narrowNoteW: 46, narrowMinScale: 0.85 }), play: 'seq'
    })),
    gen: i => {

      return kinds[(i + Math.floor(i / list.length)) % kinds.length]();

}

/* 楽譜を置く（線の番号・音符の下の説明つき） */
function drawStaff(el, o) {
  const api = renderStaff(el, o);
  const NS = 'http://www.w3.org/2000/svg';
  const txt = (x, y, s, size, color, anchor) => {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('font-size', size || 15);
    t.setAttribute('font-weight', '900'); t.setAttribute('fill', color || '#7b5cff');
    t.setAttribute('text-anchor', anchor || 'start'); t.setAttribute('font-family', 'Zen Maru Gothic, sans-serif');
    t.textContent = s; api.svg.appendChild(t);
  };
  if (o.lineNo) {
    const st = api.staves[api.staves.length - 1];
    const xr = st.getX() + st.getWidth() + 6;
    const w0 = api.total + 26;
    api.svg.setAttribute('viewBox', `0 0 ${w0} ${api.height}`);
    api.svg.style.maxWidth = (w0 * (o.scale || 1.8)) + 'px';
    for (let k = 1; k <= 5; k++) txt(xr, st.getYForLine(5 - k) + 5, k, 14, '#7b5cff');
  }
  if (o.sub) o.sub.forEach((s, i) => txt(api.nx[i], api.yOf(-3) + 18, s, 14, '#c2410c', 'middle'));
  return api;
}

function practice(st, scr, body) {
  Audio2.stopAll(); Mic.stop();
  const n = st.n || 8;
  const state = { i: 0, firstOk: 0, combo: 0, best: 0, xp: 0 };
  const wrap = h('div', { class: 'wrap', style: { maxWidth: '900px' } });
  body.innerHTML = ''; body.appendChild(wrap); body.scrollTop = 0;
  const head = h('div', { class: 'qhead' });
  const dots = h('div', { class: 'dots' });
  for (let k = 0; k < n; k++) dots.appendChild(h('i'));
  const comboEl = h('div', { class: 'combo' });
  head.append(dots, comboEl);
  wrap.appendChild(head);
  const area = h('div'); wrap.appendChild(area);
  const recent = [];
  const showCombo = () => {
    comboEl.className = 'combo' + (state.combo >= 2 ? ' on' : '') + (state.combo >= 5 ? ' fire' : '');
    comboEl.textContent = state.combo >= 2 ? state.combo + ' れんぞく' : '';
    if (state.combo >= 2) { comboEl.classList.remove('pop'); void comboEl.offsetWidth; comboEl.classList.add('pop'); }
  };
  const nextQ = () => {
    if (state.i >= n) return finish();
    [...dots.children].forEach((d, k) => d.classList.toggle('now', k === state.i));
    let q, guard = 0;
    do { q = st.gen(state.i); guard++; } while (guard < 6 && recent.includes(qKey(q)));
    recent.push(qKey(q)); if (recent.length > 3) recent.shift();
    q.__combo = state.combo;
    runQuestion(q, area, (firstTry) => {

      msg.textContent = hitN === expect.length ? 'よけいに たたいた所が あったよ。休符は たたかないでね' : `おしい！ ${expect.length}こ中 ${hitN}こ あってたよ。赤い所を もう一回`;
      c.ng();
      startB.disabled = false; listen.disabled = false; startB.textContent = 'もう一回'; startB.classList.add('glow');
      if (fails >= 2) { skipB.style.display = ''; }
    };
    skipB.addEventListener('click', tap(() => { if (!c.isDone()) c.ok(); }));
  },
  blow(q, box, c) { blowCommon(q, box, c, [N(q.target, 'w')]); },
  blowSeq(q, box, c) { blowCommon(q, box, c, q.notes); }
};

/* せまい画面では、要らない低い けんばんを はぶいて 1つずつを 大きくする */
function kbFrom(minStep) { return (window.innerWidth < 640 && minStep != null && minStep >= 0) ? 0 : -3; }

/* 今の音符が見える所まで そっと動かす（いちばん上へは もどさない ★16） */
function seeNote(api, i) {
  const g = api.groups[i]; if (!g || api.measures.length < 2) return;
  const body = g.closest('.body'); if (!body) return;
  const r = g.getBoundingClientRect(), b = body.getBoundingClientRect();
  const kb = body.querySelector('.kb-stick'); const bottom = b.bottom - (kb ? kb.getBoundingClientRect().height + 20 : 20);
  if (r.top < b.top + 10 || r.bottom > bottom) body.scrollBy({ top: r.top - b.top - (bottom - b.top) / 3, behavior: 'smooth' });
}

/* ふく・うたう（マイクは つかっても つかわなくても よい） */
function blowCommon(q, box, c, notes) {
  const seq = notes.length > 1;
  const sb = h('div', { class: 'stage' }); box.appendChild(sb);
  const row = h('div', { class: 'learn-visual' }); sb.appendChild(row);
  const sv = h('div', { class: 'vf', style: { flex: '1 1 300px' } }); row.appendChild(sv);
  const api = drawStaff(sv, { notes, time: seq ? (q.time || '4/4') : null, pickup: q.pickup, compound: q.time === '6/8', names: seq ? false : true, scale: seq ? 1.6 : 2.2, ctx: q.kind === 'rec' ? 'rec' : null, fit: true });
  const recBox = q.kind === 'rec' ? h('div', { class: 'rec', style: { width: 'min(150px,34vw)' } }) : null;
  if (recBox) row.appendChild(recBox);
  let idx = 0, hold = 0;
  const skip = () => { while (notes[idx] && (notes[idx].s == null || (idx > 0 && notes[idx - 1].tie))) idx++; };
  const show = () => {
    api.groups.forEach((g, k) => { if (!g) return; g.classList.toggle('vf-hl', k === idx); g.classList.toggle('vf-ok', k < idx); });
    seeNote(api, idx);
    if (recBox && notes[idx]) recBox.innerHTML = recorderSvg(fingering(notes[idx].s), { label: jname(notes[idx].s, null, 'rec') });
  };
  skip(); show();
  const stat = h('div', { class: 'micstat' });
  const meter = h('div', { class: 'meter' }, h('i'));
  const micB = h('button', { class: 'btn grape' }, svgEl(ICON.mic), 'マイクで 聞いてもらう');
  const selfB = h('button', { class: 'btn ' + (Store.set.mic ? 'ghost' : 'glow') }, seq ? 'さいごまで できた！' : (q.kind === 'sing' ? 'うたえた！' : 'ふけた！'));
  const listen = h('button', { class: 'btn teal' }, svgEl(ICON.ear), 'おてほん');
  box.appendChild(h('div', { class: 'foot' }, listen, Store.set.mic ? micB : null, selfB));
  box.appendChild(stat);
  box.querySelectorAll('.foot svg').forEach(s => { s.style.width = '26px'; s.style.height = '26px'; s.style.color = 'inherit'; });
  const kind = q.kind === 'rec' ? 'rec' : 'piano';
  listen.addEventListener('click', tap(() => { Mic.stop(); micOn = false; micB.disabled = false; Audio2.playSeq(notes, { tempo: q.tempo || 88, kind, onNote: i => api.hl(i), onEnd: show }); }));
  selfB.addEventListener('click', tap(() => { if (!c.isDone()) { Mic.stop(); c.ok(); } }));
  let micOn = false, needGap = false, gapN = 0, peak = 0;
  micB.addEventListener('click', tap(async () => {
    if (micOn || c.isDone()) return;
    Audio2.stopAll();
    loading(true, 'マイクを じゅんび中…');
    try {
      await Mic.start(r => {
        if (c.isDone() || idx >= notes.length) return;
        meter.firstChild.style.width = Math.min(100, (r.rms || 0) * 900) + '%';
        peak = Math.max(peak * 0.995, r.rms || 0);
        if (needGap) { if (r.f <= 0 || (r.rms || 0) < peak * 0.45) { gapN++; if (gapN >= 2) { needGap = false; gapN = 0; } } return; }
        if (r.f <= 0) { hold = Math.max(0, hold - 1); return; }
        const mm = freqToMidi(r.f);
        const want = midiOf(notes[idx].s, notes[idx].acc) % 12;
        const got = ((mm.m % 12) + 12) % 12;
        stat.firstChild.textContent = '聞こえた音：' + pcName(got);
        if (got === want && Math.abs(mm.cents) < 45) {
          hold++;
          if (hold >= 7) {
            const prev = midiOf(notes[idx].s, notes[idx].acc);
            hold = 0; idx++; skip();
            // 同じ高さの音が つづくときは、いちど 息を切って（タンギング）から つぎへ
            if (notes[idx] && midiOf(notes[idx].s, notes[idx].acc) === prev) { needGap = true; gapN = 0; peak = 0; }
            if (idx >= notes.length) { show(); Mic.stop(); c.ok(); }
            else show();
          }
        } else hold = Math.max(0, hold - 2);
      });
      micOn = true; micB.disabled = true;
      stat.innerHTML = ''; stat.appendChild(h('span', null, q.kind === 'sing' ? 'うたってみて！' : 'ふいてみて！')); stat.appendChild(meter);
    } catch (e) {
      stat.innerHTML = ''; stat.appendChild(h('span', null, 'マイクが つかえませんでした。「' + selfB.textContent + '」を おしてね'));
      micB.style.display = 'none'; selfB.classList.add('glow');
    } finally { loading(false); }
  }));
  stat.appendChild(h('span', { class: 'muted', style: { fontSize: '.85em' } }, q.kind === 'sing' ? 'おてほんを聞いてから うたってみよう' : '指づかいを 見ながら ふいてみよう'));
}

/* ===== 3Dの島めぐり地図（three.js） ===== */
const World3D = {
  alive: false,
  can() {
    if (!window.THREE || Store.set.map3d === false || this.broken) return false;
    if (this._can == null) { // 1回だけ たしかめて、つかった WebGL は すぐ手放す
      try {
        const c = document.createElement('canvas'); const gl = c.getContext('webgl2') || c.getContext('webgl');
        this._can = !!gl;
        if (gl) { const ext = gl.getExtension('WEBGL_lose_context'); if (ext) ext.loseContext(); }
      } catch (e) { this._can = false; }
    }
    return this._can;
  },
  dispose() {
    if (!this.alive) return;
    this.alive = false;
    cancelAnimationFrame(this.raf);
    if (this.ro) this.ro.disconnect();
    if (this.io) this.io.disconnect();
    this.fly = null; this.hover = null;
    if (this.scene) this.scene.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) [].concat(o.material).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
    });
    if (this.renderer) { this.renderer.dispose(); try { this.renderer.forceContextLoss(); } catch (e) { } }
    this.scene = this.renderer = null;
  },
  /* 島の位置（くねくねの航路） */
  POS: [[-15, 6], [-7.5, 1], [0, 6.5], [7.5, 1], [15, 6], [7.5, -6.5], [0, -2.5], [-9, -8.5], [-17, -3]],
  async mount(host, opt) {
    this.dispose();
    const T = THREE;
    this.fly = null; this.hover = null;
    const token = this.token = (this.token || 0) + 1;
    this.onPick = opt.onPick;
    const W = () => host.clientWidth || 600, H = () => host.clientHeight || 400;
    const renderer = new T.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'low-power' });
    this.alive = true;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(W(), H());
    renderer.outputEncoding = T.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFSoftShadowMap;
    host.appendChild(renderer.domElement);
    renderer.domElement.style.cssText = 'display:block;width:100%;height:100%;touch-action:pan-y;border-radius:inherit'; // たてのスクロールは じゃましない
    // WebGL が切れたら（iPadを うらに回した など）2Dの一覧に まかせる
    renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); if (!this.alive || token !== this.token) return; /* 自分で片づけた時は ちがう */ this.broken = true; this.dispose(); if (opt.onLost) opt.onLost(); });
    this.renderer = renderer;
    const scene = new T.Scene();
    this.scene = scene;
    scene.background = new T.Color('#9fdcf7');
    scene.fog = new T.Fog('#bfe8fb', 38, 80);
    const cam = new T.PerspectiveCamera(42, W() / H(), 0.1, 200);
    this.cam = cam;

    // 光
    scene.add(new T.HemisphereLight('#ffffff', '#5aa9c9', 0.75));
    const sun = new T.DirectionalLight('#fff4d6', 0.95);
    sun.position.set(-20, 30, 14); sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 90 });
    scene.add(sun);

    // 空の グラデーション（大きな球の内側）
    const skyGeo = new T.SphereGeometry(120, 24, 12);
    const skyMat = new T.ShaderMaterial({
      side: T.BackSide, depthWrite: false, fog: false,
      uniforms: { top: { value: new T.Color('#5fbfee') }, bot: { value: new T.Color('#e9f8ff') } },
      vertexShader: 'varying float h; void main(){ h = normalize(position).y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'uniform vec3 top; uniform vec3 bot; varying float h; void main(){ gl_FragColor = vec4(mix(bot, top, smoothstep(-0.05, 0.6, h)), 1.0); }'
    });
    scene.add(new T.Mesh(skyGeo, skyMat));

    // 海（波うつ）
    const seaGeo = new T.PlaneGeometry(160, 160, 80, 80);
    seaGeo.rotateX(-Math.PI / 2);
    const seaMat = new T.MeshStandardMaterial({ color: '#2fa6dc', roughness: 0.35, metalness: 0.1, flatShading: true, transparent: true, opacity: 0.96 });
    const sea = new T.Mesh(seaGeo, seaMat); sea.receiveShadow = true;
    scene.add(sea);
    const seaBase = seaGeo.attributes.position.array.slice();

    // 太陽
    const sunBall = new T.Mesh(new T.SphereGeometry(3.2, 24, 16), new T.MeshBasicMaterial({ color: '#ffe17a', fog: false }));
    sunBall.position.set(-34, 22, -60); scene.add(sunBall);

    // 雲
    const clouds = new T.Group(); scene.add(clouds);
    const cloudMat = new T.MeshStandardMaterial({ color: '#ffffff', roughness: 1, flatShading: true });
    for (let i = 0; i < 9; i++) {
      const g = new T.Group();
      for (let k = 0; k < 4; k++) { const b = new T.Mesh(new T.IcosahedronGeometry(1.2 + Math.random() * 0.9, 0), cloudMat); b.position.set(k * 1.4 - 2, Math.random() * 0.6, Math.random() * 0.8); g.add(b); }
      g.position.set(-45 + Math.random() * 90, 11 + Math.random() * 6, -30 + Math.random() * 25);
      g.userData.v = 0.25 + Math.random() * 0.35;
      clouds.add(g);
    }

    // 島
    const islands = [];
    const nx = nextStage();
    const mat = (c, o) => new T.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85, flatShading: true }, o || {}));
    ISLANDS.forEach((isl, i) => {
      const [x, z] = this.POS[i];
      const g = new T.Group(); g.position.set(x, 0, z);
      // 砂浜と草地
      const sand = new T.Mesh(new T.CylinderGeometry(3.4, 3.9, 1.1, 9), mat('#ffe2a0')); sand.position.y = 0.1; sand.receiveShadow = true; sand.castShadow = true; g.add(sand);
      const grass = new T.Mesh(new T.CylinderGeometry(2.7, 3.2, 0.7, 9), mat(isl.color)); grass.position.y = 0.8; grass.castShadow = true; grass.receiveShadow = true; g.add(grass);
      const land = this.landmark(T, isl.id, mat); land.position.y = 1.15; g.add(land);
      g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.userData.island = i; } });
      g.userData = { island: i, baseY: 0, phase: i * 0.8 };
      scene.add(g);
      // 名前の札
      const pg = islandProgress(isl);
      const label = this.label(T, i + 1, isl.name, pg, isl.color, nx && nx.island === isl);
      label.position.set(x, 7.6, z);
      label.userData.island = i;
      scene.add(label);
      islands.push({ g, label, isl });
    });
    this.islands = islands;

    // 航路（ブイの点線）
    const buoyMat = mat('#ffffff'); const buoyMat2 = mat('#ff6f4f');
    for (let i = 0; i < this.POS.length - 1; i++) {
      const [x1, z1] = this.POS[i], [x2, z2] = this.POS[i + 1];
      for (let k = 1; k < 6; k++) {
        const t = k / 6; const b = new T.Mesh(new T.SphereGeometry(0.18, 8, 6), k % 2 ? buoyMat : buoyMat2);
        b.position.set(x1 + (x2 - x1) * t, 0.15, z1 + (z2 - z1) * t + Math.sin(t * Math.PI) * 1.2);
        b.userData.bob = Math.random() * 6; scene.add(b);
      }
    }

    // 船（いまの場所）
    const boat = this.boat(T, mat);
    const target = nx ? ISLANDS.indexOf(nx.island) : ISLANDS.length - 1;
    const [bx, bz] = this.POS[target];
    boat.position.set(bx + 3.9, 0.2, bz + 3.2);
    scene.add(boat);
    this.boatObj = boat;

    // ふわふわ上がる音符
    const notes = new T.Group(); scene.add(notes);
    const noteMat = new T.MeshStandardMaterial({ color: '#2c3550', roughness: 0.4 });
    const noteMats = ['#ff6f4f', '#7b5cff', '#12b5a5', '#ffc531'].map(c => new T.MeshStandardMaterial({ color: c, roughness: 0.4, emissive: c, emissiveIntensity: 0.25 }));
    for (let i = 0; i < 14; i++) {
      const n = new T.Group();
      const m = noteMats[i % 4];
      const head = new T.Mesh(new T.SphereGeometry(0.32, 12, 8), m); head.scale.set(1.25, 0.9, 0.9); head.rotation.z = 0.4; n.add(head);
      const stem = new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 1.3, 6), m); stem.position.set(0.33, 0.6, 0); n.add(stem);
      n.position.set(-18 + Math.random() * 36, Math.random() * 10, -10 + Math.random() * 20);
      n.userData.v = 0.4 + Math.random() * 0.5; n.userData.p = Math.random() * 6;
      notes.add(n);
    }

    // カメラの位置（全体が入るように）
    const frame = () => {
      const a = W() / H();
      cam.aspect = a; cam.updateProjectionMatrix();
      this.portrait = a < 0.9;
      let k;
      if (this.portrait) { // たて長：横から見て、島の道を たてに ならべる
        k = Math.min(1.9, Math.max(1.3, 1.05 / a));
        this.home = { pos: new T.Vector3(25 * k, 30 * k, 0.01), look: new T.Vector3(0, 0, -0.5) };
      } else {
        k = Math.min(2.6, Math.max(1.22, 2.5 / a)); // 横長ほど近く
        this.home = { pos: new T.Vector3(0, 20 * k, 21 * k), look: new T.Vector3(0, 0, -0.8) };
      }
      const d = this.home.pos.length(); scene.fog.near = d * 0.95; scene.fog.far = d * 2.3;
      const ls = (this.portrait ? 5.2 : 8.2) * k; (this.islands || []).forEach(o => o.label.scale.set(ls, ls / 2, 1));
      if (!this.fly) { cam.position.copy(this.home.pos); cam.lookAt(this.home.look); }
      renderer.setSize(W(), H());
    };
    frame();
    this.ro = new ResizeObserver(() => this.alive && frame());
    this.ro.observe(host);

    // さわる（タップで島をえらぶ。少し動かしたら見回す）
    const ray = new T.Raycaster(), ptr = new T.Vector2();
    let down = null, panX = 0, panZ = 0;
    const el = renderer.domElement;
    const pickAt = (cx, cy) => {
      const r = el.getBoundingClientRect();
      ptr.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ptr, cam);
      const hits = ray.intersectObjects(scene.children, true);
      for (const hh of hits) { let o = hh.object; while (o) { if (o.userData && o.userData.island != null) return o.userData.island; o = o.parent; } }
      return null;
    };
    el.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, px: panX, pz: panZ }; try { el.setPointerCapture(e.pointerId); } catch (er) { } });

function checkFriends() {
  const me = Store.me; if (!me) return [];
  me.friends = me.friends || {};
  const got = [];
  FRIENDS.forEach(f => { if (!me.friends[f.id] && f.cond(me)) { me.friends[f.id] = Date.now(); got.push(f); } });
  if (got.length) Store.save();
  return got;
}
function addXP(n) {
  const me = Store.me; if (!me) return { before: 0, after: 0, rankUp: false };
  const before = me.xp || 0;
  me.xp = before + n; Store.save();
  return { before, after: me.xp, rankUp: rankOf(me.xp) > rankOf(before) };
}

/* お祝いの 待ち行列（画面を すぐ移っても のがさない） */
function queueCele(items, front) {
  const me = Store.me; if (!me || !items.length) return;
  me.pending = me.pending || [];
  if (front) me.pending.unshift(...items); else me.pending.push(...items);
  Store.save();
}
let celeBusy = false;
async function flushCele() {
  const me = Store.me; if (!me || celeBusy || !me.pending || !me.pending.length) return;
  celeBusy = true;
  try {
    while (me.pending.length) {
      const it = me.pending.shift(); Store.save();
      const item = it.type === 'friend' ? { type: 'friend', f: FRIENDS.find(f => f.id === it.id) } : it;
      if (item.type === 'friend' && !item.f) continue;
      await celebrate([item]);
    }
  } finally { celeBusy = false; }
}
/* できたときの 大きな知らせ（なかま・ランク） */
async function celebrate(list) {
  for (const it of list) {
    Audio2.fanfare(); confetti(50);

    if (it.type === 'rank') await dialog({ art: guideSvg('wow').replace('<svg ', '<svg width="120" '), title: 'ランク アップ！', text: `きみは「${it.name}」に なった！`, buttons: [{ label: 'やったー！', value: true, cls: 'sun big' }], outside: false });
  }
}

function singAllMode() {
  bigFrame('楽譜を見て 歌う・ふく', (wrap) => {
    const BASE = MELODIES.concat(REC_MELODIES);
    const recOk = m => m.notes.every(n => n.s == null || (n.s >= 0 && n.s <= 9) && !n.acc);
    let src = 'base', ALL = BASE, list = ALL;
    let mi = 0, names = true, sound = true, tempo = 84, rec = false, api = null;
    const isKy = m => KYOTSU.includes(m);
    const tOf = m => m.time || '4/4';
    const tempoOf = m => Math.round((isKy(m) ? kyTempo(m) : 84) * ({ 66: .8, 84: 1, 100: 1.18 }[tempo] || 1));
    const perOf = m => tOf(m) === '6/8' ? 6 : Number(tOf(m)[0]);
    const setSrc = v => { src = v; ALL = v === 'base' ? BASE : KYOTSU.filter(m => m.grade === v); list = rec ? ALL.filter(recOk) : ALL; mi = 0; drawSel(); draw(); };
    const scr = h('div', { class: 'big-screen' });
    const row = h('div', { class: 'learn-visual', style: { width: '100%' } });
    const sv = h('div', { class: 'vf', style: { flex: '1 1 600px' } });
    const recBox = h('div', { class: 'rec', style: { width: 'min(160px,24vw)', display: 'none' } });
    const cntEl = h('div', { class: 'count', style: { fontSize: '3.4em' } });
    row.append(sv, recBox); scr.append(cntEl, row);
    const sel = h('div', { class: 'chips' });
    const drawSel = () => { const keep = sel.scrollLeft; sel.innerHTML = ''; list.forEach((m, i) => sel.appendChild(h('button', { class: 'btn small ' + (i === mi ? 'grape' : 'ghost'), onclick: () => { mi = i; drawSel(); draw(); } }, m.title))); sel.scrollLeft = keep; };
    const draw = () => {
      Audio2.stopAll();
      const m = list[mi];
      if (!m) { sv.innerHTML = '<div class="muted center" style="padding:30px">リコーダーで ふける曲（低いド〜高いミ）が ありません</div>'; api = null; recBox.style.display = 'none'; return; }
      api = drawStaff(sv, { notes: m.notes, time: tOf(m), pickup: m.pickup || 0, compound: tOf(m) === '6/8', names, scale: 2.6, ctx: rec ? 'rec' : null, fit: true, minScale: isKy(m) ? 1.15 : 2.1, noteW: isKy(m) ? 40 : undefined });
      recBox.style.display = rec ? '' : 'none';
      showRec(firstIdx(m.notes));
    };
    const firstIdx = ns => ns.findIndex(n => n.s != null);
    const showRec = i => { const n = list[mi].notes[i]; if (rec && n && n.s != null && n.s >= 0 && n.s <= 9) recBox.innerHTML = recorderSvg(fingering(n.s), { label: jname(n.s, null, 'rec') }); };
    const run = () => {
      const m = list[mi]; if (!m || !api) return;
      Audio2.stopAll();
      const tempo = tempoOf(m), six = tOf(m) === '6/8';
      const countIn = six ? 6 : perOf(m), unit = six ? .5 : 1;
      if (sound) Audio2.playSeq(m.notes, { tempo, countIn, unit, kind: rec ? 'rec' : 'piano', onCount: k => { cntEl.textContent = k; }, onNote: i => { cntEl.textContent = ''; api.hl(i); showRec(i); seeNote(api, i); }, onEnd: () => { api.hl(-1); xCard(); } });
      else Audio2.playSeq(m.notes, { tempo, rhythmOnly: false, countIn, unit, metro: true, beatsPerBar: perOf(m), kind: 'none', onCount: k => { cntEl.textContent = k; }, onNote: i => { cntEl.textContent = ''; api.hl(i); showRec(i); seeNote(api, i); }, onEnd: () => { api.hl(-1); xCard(); }, silent: true });
    };
    const srcRow = h('div', { class: 'row c', style: { margin: '6px 0' } },
      segRow([['base', 'いつもの曲']].concat(KY_GRADES.map(g => [g, `共通教材 ${g}年`])), src, setSrc));
    const ctrl = h('div', { class: 'row c', style: { margin: '10px 0' } },
      segRow([[true, '階名を出す'], [false, '階名をかくす']], names, v => { names = v; draw(); }),
      segRow([[true, '音を鳴らす'], [false, 'メトロノームだけ']], sound, v => sound = v),
      segRow([[false, '歌う'], [true, 'リコーダー']], rec, v => { rec = v; const cur = list[mi]; list = rec ? ALL.filter(recOk) : ALL; mi = Math.max(0, list.indexOf(cur)); drawSel(); draw(); }),
      segRow([[66, 'ゆっくり'], [84, 'ふつう'], [100, 'はやい']], tempo, v => tempo = v));
    wrap.append(srcRow, sel, ctrl, scr, h('div', { class: 'foot' }, h('button', { class: 'btn big glow', onclick: tap(run) }, 'スタート'), h('button', { class: 'btn big ghost', onclick: tap(() => { Audio2.stopAll(); api && api.hl(-1); cntEl.textContent = ''; }) }, 'とめる')));
    drawSel(); draw();
  });
}

      h('p', null, h('b', null, '授業（大型テレビ）：'), 'この画面の4つの一斉モードを使います。フラッシュカード・リズム打ち・聞いてどれ・楽譜を見て歌う／ふく。「楽譜を見て歌う／ふく」では、学習指導要領の歌唱共通教材（著作権の切れた曲）を学年ごとに大きく映せます（旋律だけ・歌詞なし）。入っていない曲：1年「うみ」（作曲者の著作権の保護期間中）、2年「かくれんぼ」・6年「越天楽今様」（旋律を書き起こせる資料が見つからず、じゅんび中）。楽譜は著作権の切れた資料から書き起こしたもので、教科書と細かいリズムがちがう所があるかもしれません。'),
      h('p', null, h('b', null, '全画面：'), '開いて 最初に画面を さわると 全画面になります。右上の □ でも 切りかえられます。iPad・iPhone は Safari の共有ボタン →「ホーム画面に追加」で、全画面のアプリとして使えます。'),
      h('p', null, h('b', null, 'マイク：'), 'リコーダー・歌の ステージで使えます。教室が にぎやかだと 聞きとれないことがあります。そのときは「ふけた！」ボタンで進めます。上の せっていで 使わない ことも できます。'),
      h('p', null, h('b', null, '音が出ないとき：'), 'iPad・iPhone の 消音スイッチ（マナーモード）を 切ってください。'),
      h('p', null, h('b', null, '記録：'), 'この端末の中だけに のこります。名前は ニックネームで十分です。')),
    buttons: [{ label: 'とじる', value: true, cls: 'ghost' }]
  });
}

let xOpening = false;
function openX(text) {
  if (xOpening) return; xOpening = true; setTimeout(() => { xOpening = false; }, 2000);
  window.open('https:' + '/' + '/twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank', 'noopener');
}
function xModal() {
  const body = h('div', { style: { display: 'grid', gap: '10px' } }, X_TEXTS.map(t => h('button', { class: 'btn ghost', style: { textAlign: 'left', fontSize: '.8em', lineHeight: '1.5', padding: '.7em 1em', borderRadius: '18px', height: 'auto' }, onclick: tap(() => { openX(t); const ov = document.querySelector('.ov'); if (ov) ov.remove(); }) }, t)));
  dialog({ title: '感想を Xで シェア', text: 'えらぶと、Xの投稿画面が 文章入りで ひらきます（自動では投稿しません）。', body, buttons: [{ label: 'とじる', value: null, cls: 'ghost small' }] });
}
function xShareLink() { return h('button', { class: 'xshare', onclick: tap(xModal) }, '📣 感想をXでシェア'); }
let xCardShown = false;
function xCard() {
  if (xCardShown) return;
  try { if (localStorage.getItem('onpuIsland.noXCard') === '1') return; } catch (e) { }
  xCardShown = true;
  const card = h('div', { class: 'xcard' },
    h('div', { style: { fontWeight: 700 } }, '授業で 使ってみて いかがでしたか？'),
    h('div', { class: 'row' },
      h('button', { class: 'btn small', onclick: tap(() => { card.remove(); xModal(); }) }, 'Xでシェア'),
      h('button', { class: 'btn ghost small', onclick: () => card.remove() }, '閉じる'),
      h('button', { class: 'btn ghost small', onclick: () => { try { localStorage.setItem('onpuIsland.noXCard', '1'); } catch (e) { } card.remove(); } }, '今後表示しない')));
  document.body.appendChild(card);
  setTimeout(() => card.remove(), 15000);
}

  const art = document.querySelector('#splash .art');
  if (art) art.innerHTML = splashArt();
  if (!window.Vex) {
    document.getElementById('app').innerHTML = '<div style="padding:40px;text-align:center;font-size:20px">楽譜の部品を 読みこめませんでした。ページを 開き直してください。</div>';
    return;
  }
  startApp();
})();
